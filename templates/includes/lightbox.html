{% load i18n %}<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
  <div class="lightbox-backdrop" data-lightbox-close></div>
  <div class="lightbox-panel" tabindex="-1">
    <button type="button" class="lightbox-close" data-lightbox-close aria-label="{% translate 'Close' %}">×</button>
    <h2 id="lightbox-title" class="visually-hidden">{% translate "Post" %}</h2>
    <div class="lightbox-body"></div>
  </div>
</div>
